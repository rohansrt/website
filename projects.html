<script>
// Project category tab switching
(function() {
  var tabs = document.querySelectorAll('.proj-tab');
  var DURATION = 200;

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var target = this.dataset.tab;
      var activePanel = document.querySelector('.proj-tab-panel.active');
      var newPanel = document.getElementById('tab-' + target);

      if (activePanel === newPanel) return;

      tabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');

      activePanel.style.transition = 'opacity ' + DURATION + 'ms ease, transform ' + DURATION + 'ms ease';
      activePanel.style.opacity = '0';
      activePanel.style.transform = 'translateY(8px)';

      setTimeout(function() {
        activePanel.classList.remove('active');
        activePanel.style.transition = '';
        activePanel.style.opacity = '';
        activePanel.style.transform = '';

        newPanel.style.opacity = '0';
        newPanel.style.transform = 'translateY(8px)';
        newPanel.classList.add('active');

        void newPanel.offsetWidth;

        newPanel.style.transition = 'opacity .25s ease, transform .25s ease';
        newPanel.style.opacity = '1';
        newPanel.style.transform = 'translateY(0)';

        setTimeout(function() {
          newPanel.style.transition = '';
          newPanel.style.opacity = '';
          newPanel.style.transform = '';
        }, 250);
      }, DURATION);
    });
  });
})();
</script>
